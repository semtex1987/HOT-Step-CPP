name: RunPod image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/runpod-image.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker/**'
      - 'engine/**'
      - 'server/**'
      - 'ui/**'
      - 'plugins/**'
      - 'noise_samples/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        run: |
          git submodule update --init engine/ggml engine/vendor/vst3sdk
          cd engine/vendor/vst3sdk
          git submodule update --init base cmake pluginterfaces public.sdk

      # Standard runners have 14 GB of free disk. CUDA build layers need more.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          docker system prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish RunPod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runpod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_ARCHS=75-virtual;80-virtual;86-real;89-real;90-real;120a-real
            ENABLE_TRT=0
            BUILD_JOBS=2
          cache-from: type=gha,scope=runpod
          cache-to: type=gha,mode=max,scope=runpod
